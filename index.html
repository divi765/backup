<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e6edf3;
    }

    .card {
      text-align: center;
      padding: 48px 40px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      max-width: 380px;
      width: 90%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 28px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #e6edf3;
    }

    p {
      font-size: 0.92rem;
      color: #8b949e;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 10px 24px;
      background: #238636;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover { background: #2ea043; }

    .error-card h1 { color: #f85149; }
    .error-card .spinner { border-top-color: #f85149; animation: none; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner"></div>
    <h1>Redirecting you...</h1>
    <p>Please wait, you will be taken to the destination automatically.</p>
    <a href="#" class="btn" id="manual-btn" style="display:none;">Open Manually →</a>
  </div>

  <script>
    // ── CONFIG ─────────────────────────────────────────────────────────────────
    // Default destination when someone hits the main URL with no parameters
    var DEFAULT_DEST = 'https://t.me/hawax_backup_1bot';
    // ──────────────────────────────────────────────────────────────────────────

    (function () {
      var params = new URLSearchParams(window.location.search);
      var dest = null;

      // ?c=channelname  →  t.me/channelname
      if (params.get('c')) {
        var ch = params.get('c').replace(/^@/, '');
        dest = 'https://t.me/' + ch;
      }

      // ?b=botname  →  t.me/botname?start=start
      else if (params.get('b')) {
        var bot = params.get('b').replace(/^@/, '');
        dest = 'https://t.me/' + bot + '?start=start';
      }

      // ?i=BASE64  →  decode and redirect (used for bot invite links)
      else if (params.get('i')) {
        try {
          // base64url → base64 → decode
          var b64 = params.get('i').replace(/-/g, '+').replace(/_/g, '/');
          dest = atob(b64);
        } catch (e) {
          dest = null; // invalid base64
        }
      }

      // ?u=https://...  →  any full URL
      else if (params.get('u')) {
        dest = decodeURIComponent(params.get('u'));
      }

      // No parameters — redirect to default destination
      else {
        dest = DEFAULT_DEST;
      }

      // Handle invalid link error
      if (!dest) {
        document.getElementById('card').classList.add('error-card');
        document.querySelector('h1').textContent = 'Invalid Link';
        document.querySelector('p').textContent = 'This link appears to be invalid or expired. Please request a new link from the bot.';
        return;
      }

      // Helper to convert Telegram web URLs into native deep-link schemes
      function getNativeTelegramUrl(url) {
        if (!url) return null;
        // 1. Invite links: t.me/+HASH or t.me/joinchat/HASH
        var inviteMatch = url.match(/t\.me\/(?:\+|joinchat\/)([A-Za-z0-9_-]+)/i);
        if (inviteMatch) {
          return 'tg://join?invite=' + inviteMatch[1];
        }
        // 2. Channel or bot usernames: t.me/channelname or t.me/bot?start=xxx
        var userMatch = url.match(/t\.me\/([A-Za-z0-9_]+)(?:\?(.*))?/i);
        if (userMatch && userMatch[1].toLowerCase() !== 'joinchat') {
          var domain = userMatch[1];
          var query = userMatch[2] ? '&' + userMatch[2] : '';
          return 'tg://resolve?domain=' + domain + query;
        }
        return null;
      }

      var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      var nativeUrl = getNativeTelegramUrl(dest);
      var primaryUrl = (isMobile && nativeUrl) ? nativeUrl : dest;

      // ── AUTO REDIRECT ────────────────────────────────────────────────────────
      if (isMobile && nativeUrl) {
        // Direct instant launch into Telegram App on mobile
        window.location.href = nativeUrl;

        // Fallback to web link if Telegram app isn't installed
        setTimeout(function () {
          window.location.replace(dest);
        }, 1500);
      } else {
        // Desktop or non-Telegram URL
        window.location.replace(dest);
      }

      // ── MANUAL BUTTON FALLBACK ───────────────────────────────────────────────
      setTimeout(function () {
        var btn = document.getElementById('manual-btn');
        btn.href = primaryUrl;
        btn.textContent = (isMobile && nativeUrl) ? 'Open in Telegram App →' : 'Open Link →';
        btn.style.display = 'inline-block';

        btn.onclick = function () {
          if (isMobile && nativeUrl) {
            window.location.href = nativeUrl;
            setTimeout(function () {
              window.location.href = dest;
            }, 1000);
            return false;
          }
        };

        document.querySelector('p').textContent =
          'Not redirected? Click the button below:';
      }, 1200);

    })();
  </script>
</body>
</html>
